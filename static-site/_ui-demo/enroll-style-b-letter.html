<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报名 · 风格 B：一封书信</title>
<style>
  :root{
    --paper:#f7f1e3; --ink:#3a3328; --vermilion:#c2452d; --pine:#1f4d3a; --line:#ddd2bc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#8a7f6a;font-family:"Noto Serif SC","Songti SC","SimSun",serif;color:var(--ink);
    display:flex;justify-content:center;padding:28px 0}
  /* 信封 */
  .envelope{width:430px;max-width:94vw;perspective:1200px}
  .flap{background:linear-gradient(180deg,#f7f1e3 0%,#efe6d2 100%);border:1px solid var(--line);
    border-radius:6px;padding:26px 30px;min-height:86vh;position:relative;
    box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .flap::before{content:"致 · 未来的共创人";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    background:var(--vermilion);color:#f7f1e3;font-size:11px;letter-spacing:.3em;padding:7px 18px;border-radius:999px}
  /* 纸纹 */
  .paper{background:var(--paper);background-image:radial-gradient(rgba(0,0,0,.03) 1px,transparent 1px);
    background-size:22px 22px;border-radius:4px;padding:34px 30px 40px;position:relative}
  .paper::after{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;background:var(--line)}
  .letter-head{text-align:center;margin-bottom:26px}
  .letter-head .camp{font-size:11px;letter-spacing:.35em;color:var(--vermilion)}
  .letter-head h1{font-size:26px;font-weight:700;letter-spacing:.14em;margin-top:10px}
  .letter-head .sub{font-size:12px;color:#8d8574;margin-top:8px;letter-spacing:.1em}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:24px 0}
  /* 正文：句子即表单 */
  .prose{font-size:15px;line-height:2.3}
  .prose .line{display:block;margin-bottom:6px}
  .prose .blank{
    display:inline-block;min-width:120px;border-bottom:1.5px solid #b3a88f;text-align:center;
    font-size:15px;color:var(--pine);background:transparent;outline:none;font-family:inherit;
    padding:0 8px;transition:border-color .3s
  }
  .prose .blank:focus{border-bottom-color:var(--vermilion)}
  .prose .blank.long{min-width:200px}
  .chips{margin-top:12px}
  .chips .chip{display:inline-block;border:1px solid #cfc4ab;border-radius:999px;padding:5px 14px;
    font-size:13px;margin:4px 6px 0 0;cursor:pointer;color:#6b6251;transition:all .2s}
  .chips .chip.on{background:var(--pine);border-color:var(--pine);color:#f7f1e3}
  /* 落款区 */
  .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px}
  .sign .who{font-size:13px;color:#8d8574}
  .sign .date{font-size:13px;color:#8d8574}
  .send{margin-top:30px;text-align:center}
  .btn{background:var(--vermilion);color:#f7f1e3;border:none;border-radius:999px;
    padding:14px 46px;font-size:15px;letter-spacing:.3em;font-family:inherit;cursor:pointer;
    box-shadow:0 4px 14px rgba(194,69,45,.3);transition:transform .15s}
  .btn:active{transform:scale(.96)}
  /* 印章动画 */
  .stamp{position:absolute;right:26px;bottom:80px;width:84px;height:84px;border:2.5px solid var(--vermilion);
    border-radius:50%;color:var(--vermilion);display:flex;align-items:center;justify-content:center;
    font-size:13px;letter-spacing:.2em;transform:rotate(-10deg) scale(0);opacity:0;
    transition:all .5s cubic-bezier(.2,1.4,.4,1)}
  .stamp.show{transform:rotate(-10deg) scale(1);opacity:1}
  .note{text-align:center;color:#8d8574;font-size:12px;margin-top:14px;line-height:1.8}
</style>
</head>
<body>
<div class="envelope">
  <div class="flap">
    <div class="paper" id="paper">
      <div class="letter-head">
        <div class="camp">南塘艺术共创营</div>
        <h1>第四期 · 报名信</h1>
        <div class="sub">从一次创作，到持续发生</div>
      </div>
      <div class="rule"></div>
      <div class="prose">
        <span class="line">你好。我是 <input class="blank" placeholder="你的名字" id="f1">，</span>
        <span class="line">来自 <input class="blank long" placeholder="城市 / 家乡" id="f2">。</span>
        <span class="line">听说第四期正在招募，我想来，因为
          <input class="blank long" placeholder="你为什么想加入？" id="f3"></span>
        <span class="line">我可以为营地带来——
          <input class="blank long" placeholder="绘画 / 做饭 / 记录 / 陪伴……" id="f4"></span>
        <div class="chips">
          <span class="chip">画画</span><span class="chip">写作</span><span class="chip">做饭</span>
          <span class="chip">摄影</span><span class="chip">唱歌</span><span class="chip">力气活</span>
        </div>
        <span class="line" style="margin-top:16px">有一点想提前告诉你们：
          <input class="blank long" placeholder="饮食禁忌 / 身体状况 / 其他（没有就写「无」）" id="f5"></span>
        <span class="line">期待在树下勾线、晚上围坐聊天的日子。南塘见。</span>
      </div>
      <div class="sign">
        <div class="who">落款：<input class="blank" placeholder="你的名字" id="f6" style="min-width:90px"></div>
        <div class="date">二〇二六年 · 秋</div>
      </div>
      <div class="send"><button class="btn" id="send">呈 上</button></div>
      <div class="note" id="note"></div>
      <div class="stamp" id="stamp">共创营<br>已收</div>
    </div>
  </div>
</div>
<script>
  var chips=[].slice.call(document.querySelectorAll('.chip'));
  chips.forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('on')})});
  document.getElementById('send').addEventListener('click',function(){
    document.getElementById('stamp').classList.add('show');
    document.getElementById('note').textContent='这封信已经收好。我们会认真读它——南塘见。';
    document.getElementById('send').style.opacity='0';
  });
</script>
</body>
</html>
